appId: com.skyempire.game
productName: SkyEmpire
executableName: SkyEmpire
copyright: Copyright © 2026 SkyEmpire contributors
directories:
  output: dist
  buildResources: build
icon: build/icon.png
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
npmRebuild: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: SkyEmpire-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SkyEmpire
linux:
  target: [AppImage]
  category: Game
publish:
  provider: github
  owner: saurabhwebdev
  repo: skyempire
  releaseType: release
