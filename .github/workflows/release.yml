name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (otherwise build only)'
        type: boolean
        default: false
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build installer
        working-directory: apps/desktop
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: SkyEmpire-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.zip
